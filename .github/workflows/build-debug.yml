name: Build Debug APK (no-VPN cloner)

# Fallback when the local Gradle build is blocked: the VM intercepts
# localhost TCP, so the Gradle daemon cannot talk to its client
# ("Could not receive a message from the daemon"). Building here
# in GitHub Actions avoids the local daemon entirely.
# Trigger manually: Actions > Build Debug APK > Run workflow.
# No keystore secret needed — debug builds use the debug key.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest already ships an Android SDK (ANDROID_HOME); the
      # setup-android action is flaky here, so use the preinstalled one
      # and install only the missing packages with its sdkmanager.
      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.13846066"

      # gradle.properties in this workspace carries the VM's egress-proxy
      # settings (hatch-egress-proxy + credentials). That host does not
      # exist on a GitHub runner, so dependency downloads would fail
      # there. Strip those lines before building; they are VM-only.
      - name: Remove VM-only proxy settings
        run: sed -i '/systemProp\..*\.proxy/d' gradle.properties

      # MicroG dibundel ke dalam APK (assets/) supaya di HP tidak perlu
      # download 108 MB saat pertama dibuka — file-nya terlalu besar
      # (>100 MB) untuk di-push ke repo, jadi diunduh di sini saat build.
      - name: Bundle MicroG into APK assets
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/microg-gmscore.apk \
            https://github.com/microg/GmsCore/releases/download/v0.3.18.252432/com.google.android.gms-252432036.apk
          ls -lh app/src/main/assets/

      # Debug key tetap: tiap runner GitHub membuat debug keystore baru,
      # jadi tiap build punya tanda tangan berbeda dan tidak bisa
      # di-install menimpa build sebelumnya ("App not installed").
      # Pakai satu keystore debug yang sama di semua build.
      - name: Install fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp .github/debug.keystore ~/.android/debug.keystore
          ls -lh ~/.android/debug.keystore

      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: MaxCloner-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
